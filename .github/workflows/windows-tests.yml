name: Windows tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}\pytest-debug

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q app.py database services tests ui utils 2>&1 |
            Tee-Object -FilePath "${{ runner.temp }}\compile.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete test suite
        shell: pwsh
        run: |
          python -m pytest tests -v --durations=20 --junitxml="${{ runner.temp }}\pytest-results.xml" 2>&1 |
            Tee-Object -FilePath "${{ runner.temp }}\pytest.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test and compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: |
            ${{ runner.temp }}\compile.log
            ${{ runner.temp }}\pytest.log
            ${{ runner.temp }}\pytest-results.xml
          if-no-files-found: warn
          retention-days: 14
